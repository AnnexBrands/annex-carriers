[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annex-carriers"
version = "0.2.0"
description = "Carrier REST API SDKs (UPS, FedEx) over one shared, dependency-free core."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Annex Brands", email = "bmonson@annexbrands.com"}]
keywords = ["ups", "fedex", "shipping", "tracking", "rates", "etd", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Forward Air is a document adapter, not a REST one: it parses remittance
# invoice PDFs. pdfminer is therefore an opt-in extra so the base package
# keeps its zero-runtime-dependency promise (see README).
forwardair = ["pdfminer.six>=20221105"]

[project.urls]
Homepage = "https://github.com/AnnexBrands/annex-carriers"
Repository = "https://github.com/AnnexBrands/annex-carriers"
"UPS API reference" = "https://developer.ups.com/api/reference"
"FedEx API reference" = "https://developer.fedex.com/api/en-us/catalog.html"

[tool.setuptools]
py-modules = ["ups_sdk", "fedex_sdk"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Builds a throwaway virtualenv to prove the packaging contract end to end.
    # Too slow for every run: `pytest -m slow`.
    "slow: full-isolation packaging checks (creates a venv)",
]
addopts = "-m 'not slow'"
filterwarnings = [
    # The compat shims warn on import; that is the point, not a test failure.
    "ignore:ups_sdk has moved:DeprecationWarning",
    "ignore:fedex_sdk has moved:DeprecationWarning",
]
